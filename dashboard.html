      channel: ch,
      current: E.summarise(leads, starts, ch, start, end, startsOk),
      previous: cmp ? E.summarise(leads, starts, ch, cmp[0], cmp[1], startsOk) : null,
      table: E.breakdown(leads, starts, ch, start, end, gran, startsOk),
      rolling: gran === "Day" ? E.rollingRpe(leads, ch, start, end) : null,
      detail: E.routingDetail(leads, ch, start, end),
    }));
    lastRender = { results, startsOk, start, end, gran };

    const sub = [`${E.fullDate(start)} to ${E.fullDate(end)}`, `by ${gran.toLowerCase()}`];
    if (cmp) sub.push(`compared with ${E.fullDate(cmp[0])} to ${E.fullDate(cmp[1])}`);
    if (state.followOns) sub.push("same-session follow-ons included");

    const cards = results.map((r) => `
      <section class="card">
        <div class="card-head"><span class="swatch" style="background:${colourOf(r.channel)}"></span><h2>${esc(r.channel)}</h2></div>
        <div class="figures">${CARD_FIGURES.map((f) => {
          if (f.starts && !startsOk) return `<div class="fig"><div class="label">${f.label}</div><div class="value na">${NOT_AVAILABLE}</div></div>`;
          const cur = r.current[f.key];
          const delta = r.previous ? deltaHtml(f.unit === "pp" ? E.ppChange(cur, r.previous[f.key]) : E.pctChange(cur, r.previous[f.key]), f.unit) : "";
          return `<div class="fig"><div class="label">${f.label}</div><div class="value">${f.format(cur)}</div>${delta}</div>`;
        }).join("")}</div>
        <div class="routing">${esc(routingLine(r.detail))}</div>
        <details class="breakdown"><summary>${esc(r.channel)} breakdown</summary>${breakdownTable(r.table, startsOk)}</details>
      </section>`).join("");

    main.innerHTML = `
      <h1>Blended RPE</h1>
      <div class="subline">${sub.join(" · ")}</div>
      <div class="filterline">${filters ? `<b>Filtered:</b> ${esc(filters)}` : `<span class="muted">No filters applied</span>`}</div>
      <details class="panel"><summary>What these figures mean</summary><div class="body"><dl class="defs">${
        DEFINITIONS.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join("")}</dl></div></details>
      ${healthPanel(m.health)}
      ${checksPanel()}
      ${routedPanel(leads)}
      ${channels.length ? cards : `<div class="msg warn">Pick at least one channel on the left.</div>`}
      ${channels.length ? `<div class="toolbar"><button class="btn primary" id="exportBtn">Download breakdown (CSV)</button></div>
      <h2 style="margin-top:28px">Trend</h2>
      <div class="chartbox"><h3 style="margin-top:0">Blended revenue</h3><div class="legend" id="legendRev"></div><div class="chart" id="chartRev"></div><div class="tooltip"></div></div>
      <div class="chartbox"><h3 style="margin-top:0">Blended RPE</h3><div class="legend" id="legendRpe"></div><div class="chart" id="chartRpe"></div><div class="tooltip"></div>
        ${gran === "Day" ? `<div class="notes"><p>Dots are daily RPE. Lines are the 7 day rolling RPE, because daily volumes are small and swing a lot.</p></div>` : ""}</div>
      <div class="notes" id="chartNotes"></div>` : ""}`;

    $("#runChecks").addEventListener("click", runChecks);
    $("#routeFrom").addEventListener("change", (e) => { state.routeFrom = e.target.value; renderMain(); });
    $("#routeTo").addEventListener("change", (e) => { state.routeTo = e.target.value; renderMain(); });
    $("#exportRouted").addEventListener("click", exportRouted);
    if (channels.length) {
      $("#exportBtn").addEventListener("click", exportCsv);
      drawCharts();
    }
  }

  function exportCsv() {
    const { results, startsOk, start, end, gran } = lastRender;
    const cols = BREAKDOWN_GROUPS.flatMap((g) => g.cols.map((c) => [`${g.title} ${c[0].toLowerCase()}`, c[1], c[3]]));
    const q = (v) => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const lines = [["Channel", "Period", "Period start", "Part period", ...cols.map((c) => c[0])].map(q).join(",")];
    for (const r of results) {
      for (const row of r.table) {
        lines.push([r.channel, row.label, E.isoFromDay(row.period), row.isPart ? "Yes" : "No",
          ...cols.map(([, key, st]) => {
            if (st && !startsOk) return NOT_AVAILABLE;
            const v = row[key];
            if (v === null) return "";
            return key === "form_conversion" ? v.toFixed(4) : Number.isInteger(v) ? v : v.toFixed(2);
          })].map(q).join(","));
      }
    }
    const filters = describeFilters();
    if (filters) lines.push("", q(`Filtered: ${filters}`));
    download(lines.join("\n"), `blended-rpe-breakdown-${E.isoFromDay(start)}-to-${E.isoFromDay(end)}-${gran.toLowerCase()}.csv`);
  }

  // ---- Charts (plain SVG, one y axis each) --------------------------------
  function niceMax(v) {
    if (!(v > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }

  function drawCharts() {
    const { results, start, end, gran } = lastRender;
    const events = CONFIG.events.map((e) => ({ day: E.dayFromISO(e.date), label: e.label })).filter((e) => e.day >= start && e.day <= end);
    const legend = (withRolling) => results.map((r) => `<span><span class="swatch" style="background:${colourOf(r.channel)}"></span>${esc(r.channel)}</span>`).join("") +
      (gran !== "Day" && results.some((r) => r.table.some((t) => t.isPart)) ? `<span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>Part period</span>` : "") +
      (withRolling ? `<span><svg width="22" height="10"><circle cx="5" cy="5" r="3" fill="currentColor" opacity=".45"/><line x1="10" y1="5" x2="22" y2="5" stroke="currentColor" stroke-width="2"/></svg>Daily, 7 day rolling</span>` : "") +
      (events.length ? `<span><svg width="12" height="12"><line x1="6" y1="0" x2="6" y2="12" stroke="var(--event)" stroke-dasharray="3 2" stroke-width="1.5"/></svg>Event</span>` : "");
    $("#legendRev").innerHTML = legend(false);
    $("#legendRpe").innerHTML = legend(gran === "Day");

    lineChart($("#chartRev"), {
      results, events, gran, key: "blended_revenue", fmtAxis: fmt.moneyWhole, fmtValue: fmt.money,
    });
    lineChart($("#chartRpe"), {
      results, events, gran, key: "rpe", fmtAxis: fmt.moneyWhole, fmtValue: fmt.money, rolling: gran === "Day",
    });

    const part = [...new Set(results.flatMap((r) => r.table.filter((t) => t.isPart).map((t) => t.label)))];
    $("#chartNotes").innerHTML =
      (part.length ? `<p>Part periods (hollow markers): ${esc(part.join(", "))}. Compare these with care.</p>` : "") +
      events.map((e, i) => `<p><strong>${i + 1}</strong> ${E.fullDate(e.day)}: ${esc(e.label)}</p>`).join("");
  }

  function lineChart(el, opts) {
    const { results, events, gran, key, fmtAxis, fmtValue, rolling } = opts;
    const W = Math.max(320, el.clientWidth || 800), H = 280;
    const M = { t: 18, r: 14, b: 28, l: 64 };
    const periods = results[0].table.map((t) => t.period);
    const x0 = periods[0], x1 = Math.max(periods[periods.length - 1], x0 + 1);
    const xs = (d) => M.l + ((d - x0) / (x1 - x0)) * (W - M.l - M.r);
    const values = results.flatMap((r) => r.table.map((t) => t[key]).concat(rolling ? r.rolling.map((p) => p.rpe) : [])).filter((v) => v !== null);
    const yMax = niceMax(Math.max(0, ...values) * 1.05);
    const ys = (v) => H - M.b - (v / yMax) * (H - M.t - M.b);
    const ns = "http://www.w3.org/2000/svg";
    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="${ns}" role="img">`;
    for (let i = 0; i <= 4; i++) {
      const v = (yMax / 4) * i, y = ys(v);
      svg += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
      svg += `<text x="${M.l - 8}" y="${y + 4}" text-anchor="end">${fmtAxis(v)}</text>`;
    }
    const step = Math.max(1, Math.ceil(periods.length / Math.max(2, Math.floor((W - M.l) / 80))));
    periods.forEach((p, i) => {
      if (i % step) return;
      const pp = E.parts(p);
      const label = gran === "Month" ? `${E.MONTHS[pp.m]} ${String(pp.y).slice(2)}` : E.dayMonth(p);
      svg += `<text x="${xs(p)}" y="${H - 8}" text-anchor="middle">${label}</text>`;
    });
    events.forEach((e, i) => {
      if (e.day < x0 || e.day > x1) return;
      const x = xs(e.day);
      svg += `<line x1="${x}" x2="${x}" y1="${M.t}" y2="${H - M.b}" stroke="var(--event)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      svg += `<circle cx="${x}" cy="${M.t - 6}" r="7" fill="var(--surface)" stroke="var(--event)"/><text x="${x}" y="${M.t - 2.5}" text-anchor="middle" style="font-size:10px;fill:var(--text-2)">${i + 1}</text>`;
    });
    const daily = gran === "Day";
    for (const r of results) {
      const colour = colourOf(r.channel);
      const pts = r.table.filter((t) => t[key] !== null);
      if (!daily || !rolling) {
        let d = "";
        r.table.forEach((t) => { if (t[key] === null) { d += " "; return; } d += `${/[\d]$/.test(d) ? "L" : "M"}${xs(t.period).toFixed(1)},${ys(t[key]).toFixed(1)}`; });
        svg += `<path d="${d}" fill="none" stroke="${colour}" stroke-width="2" stroke-linejoin="round" ${daily ? 'opacity=".9"' : ""}/>`;
      }
      if (rolling) {
        let d = "";
        r.rolling.forEach((p) => { if (p.rpe === null) { d += " "; return; } d += `${/[\d]$/.test(d) ? "L" : "M"}${xs(p.day).toFixed(1)},${ys(p.rpe).toFixed(1)}`; });
        svg += `<path d="${d}" fill="none" stroke="${colour}" stroke-width="2.5" stroke-linejoin="round"/>`;
      }
      if (!daily || rolling || periods.length <= 45) {
        for (const t of pts) {
          const cx = xs(t.period), cy = ys(t[key]);
          if (t.isPart) svg += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="var(--surface)" stroke="${colour}" stroke-width="2"/>`;
          else svg += `<circle cx="${cx}" cy="${cy}" r="${daily ? 3 : 4.5}" fill="${colour}" ${rolling ? 'opacity=".45"' : 'stroke="var(--surface)" stroke-width="2"'}/>`;
        }
      }
    }
    svg += `<line class="cross" x1="0" x2="0" y1="${M.t}" y2="${H - M.b}" stroke="var(--text-3)" stroke-width="1" visibility="hidden"/>`;
    svg += `<rect class="hit" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/></svg>`;
    el.innerHTML = svg;

    const tip = el.parentElement.querySelector(".tooltip");
    const svgEl = el.querySelector("svg");
    const cross = svgEl.querySelector(".cross");
    const hit = svgEl.querySelector(".hit");
    const move = (evt) => {
      const rect = svgEl.getBoundingClientRect();
      const px = ((evt.clientX - rect.left) / rect.width) * W;
      let best = 0;
      periods.forEach((p, i) => { if (Math.abs(xs(p) - px) < Math.abs(xs(periods[best]) - px)) best = i; });
      const p = periods[best];
      cross.setAttribute("x1", xs(p)); cross.setAttribute("x2", xs(p)); cross.setAttribute("visibility", "visible");
      const row0 = results[0].table[best];
      const evs = events.filter((e) => (gran === "Day" ? e.day === p : e.day >= p && e.day < (periods[best + 1] ?? Infinity)));
      tip.innerHTML = `<div class="t">${esc(row0.label)}${row0.isPart ? " (part period)" : ""}</div>` +
        results.map((r) => {
          const t = r.table[best];
          const roll = rolling ? r.rolling.find((q) => q.day === p) : null;
          return `<div class="r"><span><span class="swatch" style="background:${colourOf(r.channel)}"></span>${esc(r.channel)}</span><strong>${fmtValue(t[key])}</strong></div>` +
            (roll ? `<div class="r small"><span style="padding-left:18px">7 day rolling</span><span>${fmtValue(roll.rpe)}</span></div>` : "") +
            (key === "rpe" ? `<div class="r small"><span style="padding-left:18px">Enquiries</span><span>${fmt.count(t.blended_enquiries)}</span></div>` : "");
        }).join("") +
        evs.map((e) => `<div class="small" style="margin-top:4px;color:var(--text-2)">◆ ${esc(e.label)}</div>`).join("");
      tip.style.display = "block";
      const box = el.parentElement.getBoundingClientRect();
      const left = evt.clientX - box.left + 14;
      tip.style.left = Math.min(left, box.width - tip.offsetWidth - 8) + "px";
      tip.style.top = Math.max(8, evt.clientY - box.top - tip.offsetHeight / 2) + "px";
    };
    hit.addEventListener("mousemove", move);
    hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
  }

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (lastRender && lastRender.results.length && $("#chartRev")) drawCharts(); }, 150);
  });

  // ---- Wire up -----------------------------------------------------------
  const drop = $("#drop");
  const input = $("#fileInput");
  drop.addEventListener("click", () => input.click());
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", () => { handleFiles(input.files); input.value = ""; });
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  reprocess();
})();
</script>
</body>
</html>
