<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blended RPE</title>
<!--
  Blended RPE dashboard. Open this file in Chrome or Edge. No install needed.
  Lead exports are read and processed inside the browser and kept in the
  browser's own storage on this machine. Nothing is sent anywhere.

  To add a form, a form type, a channel or an event marker, edit CONFIG below
  (search for "EDIT HERE"), save, and reload the page.
-->
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --surface-2: #efeeeb;
  --border: #dddcd7;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #74736e;
  --accent: #2a78d6;
  --good: #1a7f37;
  --good-bg: #e6f4ea;
  --bad: #c62828;
  --bad-bg: #fdecea;
  --warn: #8a5a00;
  --warn-bg: #fff4d6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
  --grid: #e6e5e1;
  --event: #8a8984;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #242423;
    --border: #353533;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #9b9a92;
    --accent: #3987e5;
    --good: #5cc27a;
    --good-bg: #1d3324;
    --bad: #ff7b72;
    --bad-bg: #3d1f1d;
    --warn: #f2c14e;
    --warn-bg: #3a2f12;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
    --grid: #2c2c2a;
    --event: #8f8e87;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242423; --border: #353533;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #9b9a92; --accent: #3987e5;
  --good: #5cc27a; --good-bg: #1d3324; --bad: #ff7b72; --bad-bg: #3d1f1d;
  --warn: #f2c14e; --warn-bg: #3a2f12;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  --grid: #2c2c2a; --event: #8f8e87;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--surface-2); border-right: 1px solid var(--border); padding: 20px 16px; }
main { padding: 24px 32px 64px; min-width: 0; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 20px 16px 48px; }
}
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2); margin: 22px 0 8px; }
aside h3:first-child { margin-top: 0; }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
.drop {
  border: 1.5px dashed var(--border); border-radius: 10px; background: var(--surface);
  padding: 16px; text-align: center; cursor: pointer; transition: border-color .15s;
}
.drop.over, .drop:hover { border-color: var(--accent); }
.drop strong { display: block; margin-bottom: 2px; }
.msg { border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
.msg.ok { background: var(--good-bg); color: var(--good); }
.msg.err { background: var(--bad-bg); color: var(--bad); }
.msg.info { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
.msg.warn { background: var(--warn-bg); color: var(--warn); }
.files { list-style: none; padding: 0; margin: 8px 0 0; }
.files li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--border); }
.files li div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 5px 10px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.link { border: 0; background: none; padding: 0 4px; color: var(--accent); }
label.field { display: block; margin: 10px 0 4px; font-size: 12.5px; color: var(--text-2); }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; min-width: 0; }
input[type=date], select, input[type=search] {
  width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
}
.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: none; padding: 6px 0; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
.check { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
.check input { margin: 0; accent-color: var(--accent); }
details.filter { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
details.filter > summary { padding: 7px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
details.filter > summary span:last-child { color: var(--text-3); font-size: 12px; }
details.filter.active > summary span:last-child { color: var(--accent); font-weight: 600; }
details.filter .body { padding: 0 10px 10px; }
details.filter .values { max-height: 220px; overflow: auto; margin-top: 6px; }
details.filter .note { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.subline { color: var(--text-2); margin-bottom: 4px; }
.filterline { margin: 6px 0 16px; }
.filterline b { color: var(--accent); }
details.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
details.panel > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
details.panel > summary .flag { color: var(--warn); font-weight: 600; margin-left: 6px; }
details.panel .body { padding: 2px 14px 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin: 14px 0; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.figures { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fig .label { font-size: 12.5px; color: var(--text-2); }
.fig .value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.fig .value.na { font-size: 14px; font-weight: 500; color: var(--text-3); padding: 8px 0; }
.delta { display: inline-block; font-size: 12.5px; font-weight: 600; border-radius: 6px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.delta.up { background: var(--good-bg); color: var(--good); }
.delta.down { background: var(--bad-bg); color: var(--bad); }
.delta.flat { background: var(--surface-2); color: var(--text-2); }
.routing { margin-top: 12px; color: var(--text-2); font-size: 13px; }
details.breakdown { margin-top: 10px; }
details.breakdown > summary { cursor: pointer; color: var(--accent); }
.tablewrap { overflow-x: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12.5px; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
th { background: var(--surface-2); font-weight: 600; color: var(--text-2); position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
th:first-child { background: var(--surface-2); }
tr.part td:first-child::after { content: " (part)"; color: var(--text-3); }
th.group { text-align: center; border-left: 1px solid var(--border); }
td.na { color: var(--text-3); }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 8px 0 12px; }
@media (max-width: 700px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.stat .label { font-size: 12px; color: var(--text-2); }
.stat .value { font-size: 18px; font-weight: 600; }
.stat.flagged { background: var(--warn-bg); }
.stat.flagged .value, .stat.flagged .label { color: var(--warn); }
.pass { color: var(--good); font-weight: 600; }
.fail { color: var(--bad); font-weight: 600; }
.chartbox { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 14px 0; position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-2); margin: 6px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-3); font-size: 11px; }
.tooltip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  min-width: 180px; display: none; z-index: 5;
}
.tooltip .t { font-weight: 600; margin-bottom: 4px; }
.tooltip .r { display: flex; justify-content: space-between; gap: 12px; }
.tooltip .r span:first-child { display: inline-flex; gap: 6px; align-items: center; color: var(--text-2); }
.notes { font-size: 12.5px; color: var(--text-2); margin-top: 6px; }
.notes p { margin: 3px 0; }
.empty { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-top: 16px; }
.busy { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 50; }
.busy div { background: var(--surface); padding: 16px 22px; border-radius: 10px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0 4px; }
dl.defs { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 4px 0 0; }
dl.defs dt { font-weight: 600; }
dl.defs dd { margin: 0; color: var(--text-2); }
@media (max-width: 600px) { dl.defs { grid-template-columns: 1fr; } dl.defs dd { margin-bottom: 6px; } }
.routed .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
@media (max-width: 900px) { .routed .pair { grid-template-columns: 1fr; } }
.routed .side { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.routed .side h4 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.routed .kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.routed .kv:first-of-type { border-top: 0; }
.routed .kv span:first-child { color: var(--text-2); }
.routed .kv.key span:last-child { font-weight: 700; }
.routed .pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.routed .pick select { width: auto; }
.routed .summary { margin: 10px 0 0; font-size: 14.5px; }
code { background: var(--surface-2); padding: 0 4px; border-radius: 4px; font-size: 12.5px; }
</style>
</head>
<body>
<div class="layout">
  <aside id="sidebar">
    <h3>Lead exports</h3>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload lead exports">
      <strong>Drop exports here</strong>
      <span class="muted small">or click to choose files (enquiries-master-anon-*.csv)</span>
      <input type="file" id="fileInput" accept=".csv,text/csv" multiple hidden>
    </div>
    <div id="uploadMsgs"></div>
    <details class="filter" id="filesBox" style="margin-top:10px">
      <summary><span>Uploaded files</span><span id="fileCount">0</span></summary>
      <div class="body"><ul class="files" id="fileList"></ul></div>
    </details>
    <div id="controls"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="busy" id="busy"><div id="busyText">Processing lead exports...</div></div>

<script>
// ===================================================================
// EDIT HERE: settings Rich can change. Save the file and reload.
// ===================================================================
const CONFIG = {
  // Leads created before this date are ignored. Earlier exports only hold
  // leased lines and invoice.
  startDate: "2026-06-01",

  // Channels shown, in order. To add Mobile later, add "Mobile" here and give
  // it an entry under channels below.
  dashboardChannels: ["Leased Lines", "Broadband", "Energy"],

  // Lead types that sit inside another journey. Not counted as form starts.
  crossSellFormTypes: ["cross-sell-energy"],

  // Partial leads have this prefix on formType and never count as enquiries.
  partialPrefix: "partial-",

  // How far to follow cross sell links (lead, parent, grandparent ...).
  maxCrossSellDepth: 5,

  // Column names in the lead exports.
  columns: {
    id: "id", formType: "formType", createdAt: "created_at", updatedAt: "updated_at",
    commission: "commission", formId: "form_id", crossSellId: "cross_sell_id",
    session: "session_id", utmSource: "utm_source", utmMedium: "utm_medium",
    campaign: "campaign_name", matchType: "match_type", device: "device",
    testArm: "variation_name", dayOfWeek: "day_of_week", buyer: "provider_name",
    valid: "valid", region: "region",
  },

  // Table A (formTypes): formType to channel, the product a lead landed as.
  // Table B (formIds): form_id to home channel, the journey a lead started in.
  // New forms appear regularly (form 35 appeared on 13 October): add them here.
  // Anything not listed is flagged in the data health panel.
  channels: [
    { name: "Leased Lines", formTypes: ["leased-lines"], formIds: [5, 21, 24, 25] },
    // broadband-mobile is a broadband lead with a mobile opt-in, not a second lead.
    { name: "Broadband", formTypes: ["broadband", "broadband-mobile"], formIds: [2, 7, 12, 14, 30, 32] },
    { name: "Energy",
      formTypes: ["compare-business-energy", "compare-business-energy-nbi",
                  "compare-business-energy-low-usage", "corporate-business-energy", "cross-sell-energy"],
      formIds: [6, 19, 29] },
    // Copy the other rows of table A and B from reference_attribution.py, e.g.
    // { name: "Invoice Finance", formTypes: ["invoice"], formIds: [] },
  ],

  // Traffic source groups from utm_source and utm_medium. Checked in this
  // order, case insensitive, matching part of the value.
  trafficSources: {
    paidMediums: ["cpc", "ppc", "paid", "sem"],
    googleSources: ["google", "adwords"],
    microsoftSources: ["bing", "microsoft", "msn"],
    aiSources: ["chatgpt", "openai", "perplexity", "claude", "gemini", "copilot"],
    emailTerms: ["email", "e-mail", "newsletter", "mailchimp", "klaviyo"],
    organicMediums: ["organic"],
    searchEngines: ["google", "bing", "yahoo", "duckduckgo", "ecosia", "yandex", "baidu"],
    partnerMediums: ["referral", "affiliate", "partner"],
    directValues: ["", "(direct)", "direct", "(none)", "none", "(not set)"],
  },

  // Campaign type from campaign_name. A blank campaign is "None".
  brandTerms: ["brand"],

  // Event markers on the trend charts.
  events: [
    { date: "2026-07-29", label: "Leased lines starts routing to broadband" },
    { date: "2026-08-01", label: "Focus Group goes from £240 to £310 a lead" },
    { date: "2026-09-28", label: "Sky leased lines goes from £220 to £280 a lead" },
    { date: "2026-10-05", label: "Energy cross sell goes live on broadband" },
  ],
};
</script>

<script>
// ENGINE START
// Loading, attribution and figures. No page code in here, so it can be tested
// on its own.
const Engine = (() => {
  const UNMAPPED = "Unmapped";
  const UNKNOWN = "Unknown";
  const REQUIRED = ["id", "formType", "created_at", "commission"];
  const NOT_AN_EXPORT = "This doesn't look like a lead export";
  const ROUTE = { DIRECT: "Direct", IN_FORM: "Routed in form", CROSS: "Cross sell", FOLLOW: "Session follow-on" };
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

  // ---- CSV ---------------------------------------------------------------
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    const rows = [];
    const n = text.length;
    let row = [];
    let i = 0;
    if (n === 0) return rows;
    for (;;) {
      let field;
      if (text.charCodeAt(i) === 34) {
        let j = i + 1;
        let out = "";
        for (;;) {
          const q = text.indexOf('"', j);
          if (q === -1) { out += text.slice(j); i = n; break; }
          out += text.slice(j, q);
          if (text.charCodeAt(q + 1) === 34) { out += '"'; j = q + 2; continue; }
          i = q + 1;
          break;
        }
        let k = i;
        while (k < n) { const c = text.charCodeAt(k); if (c === 44 || c === 10 || c === 13) break; k++; }
        field = out + text.slice(i, k);
        i = k;
      } else {
        let k = i;
        while (k < n) { const c = text.charCodeAt(k); if (c === 44 || c === 10 || c === 13) break; k++; }
        field = text.slice(i, k);
        i = k;
      }
      row.push(field);
      if (i >= n) { rows.push(row); break; }
      const c = text.charCodeAt(i);
      if (c === 44) {
        i++;
        if (i >= n) { row.push(""); rows.push(row); break; }
        continue;
      }
      if (c === 13) { i++; if (text.charCodeAt(i) === 10) i++; } else i++;
      rows.push(row);
      row = [];
      if (i >= n) break;
    }
    return rows.filter((r) => !(r.length === 1 && r[0] === ""));
  }

  function headerOf(text) {
    const end = text.search(/\r?\n/);
    const first = parseCSV(end === -1 ? text : text.slice(0, end));
    return first.length ? first[0].map((h) => h.trim()) : [];
  }

  function isLeadExport(header) {
    return REQUIRED.every((c) => header.includes(c));
  }

  // ---- Values ------------------------------------------------------------
  const RE_ISO = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/;
  const RE_UK = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/;
  const RE_EXCEL = /^\s*\d{1,2}\/\d{1,2}\/\d{4}/;

  // Seconds since 1970 treating the wall clock time as is (UK time).
  function parseDate(value) {
    const s = String(value).trim();
    if (!s) return null;
    let m = RE_ISO.exec(s);
    let y, mo, d, h = 0, mi = 0, se = 0;
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = RE_UK.exec(s))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
    else return null;
    if (m[4] !== undefined) { h = +m[4]; mi = +m[5]; se = m[6] ? +m[6] : 0; }
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59 || se > 59) return null;
    const t = Date.UTC(y, mo - 1, d, h, mi, se);
    if (new Date(t).getUTCDate() !== d) return null;
    return t / 1000;
  }

  function parseMoney(value) {
    const n = Number(String(value).replace(/[£,\s]/g, ""));
    return Number.isFinite(n) ? n : 0;
  }

  function normId(value) {
    let s = String(value ?? "").trim();
    if (s.endsWith(".0")) s = s.slice(0, -2);
    return s;
  }

  // ---- Days --------------------------------------------------------------
  const dayOf = (ts) => Math.floor(ts / 86400);
  function dayFromISO(iso) { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
  function isoFromDay(day) { return new Date(day * 86400000).toISOString().slice(0, 10); }
  function parts(day) {
    const dt = new Date(day * 86400000);
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth(), d: dt.getUTCDate(), wd: (dt.getUTCDay() + 6) % 7 };
  }
  function monthStart(day) { const p = parts(day); return Date.UTC(p.y, p.m, 1) / 86400000; }
  function monthEnd(day) { const p = parts(day); return Date.UTC(p.y, p.m + 1, 0) / 86400000; }
  function shiftMonths(day, n) {
    const p = parts(day);
    const last = new Date(Date.UTC(p.y, p.m + n + 1, 0)).getUTCDate();
    return Date.UTC(p.y, p.m + n, Math.min(p.d, last)) / 86400000;
  }
  const dayMonth = (day) => { const p = parts(day); return `${p.d} ${MONTHS[p.m]}`; };
  const fullDate = (day) => { const p = parts(day); return `${p.d} ${MONTHS[p.m]} ${p.y}`; };

  // ---- Loading -----------------------------------------------------------
  function readFile(file, config) {
    const table = parseCSV(file.text);
    if (!table.length) return { rows: [], header: [] };
    const header = table[0].map((h) => h.trim());
    if (!isLeadExport(header)) return { rows: [], header };
    const col = {};
    for (const [key, name] of Object.entries(config.columns)) col[key] = header.indexOf(name);
    const get = (r, key) => (col[key] >= 0 ? (r[col[key]] ?? "") : "");
    const created = table.slice(1).map((r) => get(r, "createdAt"));
    const nonBlank = created.filter((v) => v.trim() !== "");
    const excel = nonBlank.length > 0 && nonBlank.filter((v) => RE_EXCEL.test(v)).length / nonBlank.length > 0.5;
    const rows = [];
    for (let i = 1; i < table.length; i++) {
      const r = table[i];
      rows.push({
        id: normId(get(r, "id")),
        formType: String(get(r, "formType")).trim(),
        createdAt: parseDate(get(r, "createdAt")),
        updatedAt: parseDate(get(r, "updatedAt")),
        commission: parseMoney(get(r, "commission")),
        formId: normId(get(r, "formId")),
        crossSellId: normId(get(r, "crossSellId")),
        session: String(get(r, "session")).trim(),
        utmSource: String(get(r, "utmSource")).trim(),
        utmMedium: String(get(r, "utmMedium")).trim(),
        campaign: String(get(r, "campaign")).trim(),
        matchType: String(get(r, "matchType")).trim(),
        device: String(get(r, "device")).trim(),
        testArm: String(get(r, "testArm")).trim(),
        dayOfWeek: col.dayOfWeek >= 0 ? String(get(r, "dayOfWeek")).trim() : null,
        buyer: String(get(r, "buyer")).trim(),
        valid: String(get(r, "valid")).trim(),
        region: String(get(r, "region")).trim(),
        file: file.name,
        excel,
      });
    }
    return { rows, header, excel };
  }

  // Untouched files win over Excel re-saves, then the latest updated_at.
  function dedupe(rows) {
    const ordered = rows.slice().sort((a, b) => {
      if (a.excel !== b.excel) return a.excel ? 1 : -1;
      const ua = a.updatedAt, ub = b.updatedAt;
      if (ua !== ub) {
        if (ua === null) return 1;
        if (ub === null) return -1;
        return ub - ua;
      }
      const ca = a.createdAt, cb = b.createdAt;
      if (ca !== cb) { if (ca === null) return 1; if (cb === null) return -1; return cb - ca; }
      return 0;
    });
    const seen = new Set();
    const out = [];
    for (const r of ordered) { if (!seen.has(r.id)) { seen.add(r.id); out.push(r); } }
    return out;
  }

  function byTimeThenId(a, b) {
    if (a.createdAt !== b.createdAt) return a.createdAt - b.createdAt;
    return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  }

  function loadFiles(files, config) {
    const sorted = files.slice().sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
    const summaries = [];
    let raw = [];
    for (const f of sorted) {
      const { rows, excel } = readFile(f, config);
      let lo = null, hi = null;
      for (const r of rows) {
        if (r.createdAt === null) continue;
        if (lo === null || r.createdAt < lo) lo = r.createdAt;
        if (hi === null || r.createdAt > hi) hi = r.createdAt;
      }
      summaries.push({
        name: f.name, rows: rows.length, excel: !!excel,
        from: lo === null ? null : dayOf(lo), to: hi === null ? null : dayOf(hi),
      });
      for (const r of rows) raw.push(r);
    }
    const unreadable = raw.filter((r) => r.createdAt === null).length;
    const dated = raw.filter((r) => r.createdAt !== null);
    const deduped = dedupe(dated);
    const startTs = dayFromISO(config.startDate) * 86400;
    const beforeStart = deduped.filter((r) => r.createdAt < startTs).length;
    const rows = deduped.filter((r) => r.createdAt >= startTs).sort(byTimeThenId);
    const health = {
      files: summaries,
      rowsRead: raw.length,
      rowsAfterDedupe: rows.length,
      duplicatesRemoved: dated.length - deduped.length,
      rowsBeforeStart: beforeStart,
      unreadableDates: unreadable,
      coverage: rows.length ? [rows[0].createdAt, rows[rows.length - 1].createdAt] : [null, null],
    };
    return { rows, health };
  }

  // ---- Attribution -------------------------------------------------------
  function maps(config) {
    const formType = new Map();
    const formId = new Map();
    for (const ch of config.channels) {
      for (const t of ch.formTypes || []) formType.set(String(t).trim(), ch.name);
      for (const id of ch.formIds || []) formId.set(normId(id), ch.name);
    }
    return { formType, formId };
  }

  const containsAny = (value, terms) => terms.some((t) => t && value.includes(t));

  function sourceGroup(source, medium, config) {
    const t = config.trafficSources;
    const s = source.toLowerCase().trim();
    const m = medium.toLowerCase().trim();
    const both = s + " " + m;
    const paid = containsAny(m, t.paidMediums);
    if (paid && containsAny(s, t.googleSources)) return "Google Ads";
    if (paid && containsAny(s, t.microsoftSources)) return "Microsoft Ads";
    if (containsAny(s, t.aiSources)) return "AI assistants";
    if (containsAny(both, t.emailTerms)) return "Email";
    if (containsAny(m, t.organicMediums) || (!paid && containsAny(s, t.searchEngines))) return "Organic search";
    if (containsAny(m, t.partnerMediums)) return "Partner referral";
    if (t.directValues.includes(s) && t.directValues.includes(m)) return "Direct or unknown";
    return "Other";
  }

  function campaignType(campaign, group, config) {
    if (campaign === "") return "None";
    if (containsAny(campaign.toLowerCase(), config.brandTerms)) return "Brand search";
    if (group === "Google Ads" || group === "Microsoft Ads") return "Product search";
    return "Other campaign";
  }

  const orUnknown = (v) => (v === "" ? UNKNOWN : v);

  function prepareRows(rows, config) {
    const { formType, formId } = maps(config);
    const prefix = config.partialPrefix;
    const crossTypes = new Set(config.crossSellFormTypes);
    return rows.map((r) => {
      const isPartial = r.formType.startsWith(prefix);
      const baseType = isPartial ? r.formType.slice(prefix.length) : r.formType;
      const landed = formType.get(baseType) ?? UNMAPPED;
      const formHome = formId.get(r.formId) ?? null;
      const source = sourceGroup(r.utmSource, r.utmMedium, config);
      const day = dayOf(r.createdAt);
      return {
        id: r.id, createdAt: r.createdAt, day, commission: r.commission,
        formType: r.formType, formId: r.formId, crossSellId: r.crossSellId, session: r.session,
        isPartial, baseType, isCrossSellType: crossTypes.has(baseType),
        landed, formHome, journey: formHome ?? landed,
        f_source: source,
        f_campaign_type: campaignType(r.campaign, source, config),
        f_campaign: orUnknown(r.campaign),
        f_match_type: orUnknown(r.matchType),
        f_device: orUnknown(r.device),
        f_form: orUnknown(r.formId),
        f_test_arm: orUnknown(r.testArm),
        f_day_of_week: r.dayOfWeek === null ? DAY_NAMES[parts(day).wd] : orUnknown(r.dayOfWeek),
        f_lead_type: orUnknown(r.formType),
        f_buyer: orUnknown(r.buyer),
        f_valid: orUnknown(r.valid),
        f_region: orUnknown(r.region),
      };
    });
  }

  function attributeLeads(prepared, config, followOns) {
    const leads = prepared.filter((r) => !r.isPartial).map((r) => ({
      ...r, startedIn: r.journey, isAddon: false,
      route: r.journey !== r.landed ? ROUTE.IN_FORM : ROUTE.DIRECT,
    }));
    const baseStarted = new Map(leads.map((l) => [l.id, l.journey]));
    const parentOf = new Map(leads.map((l) => [l.id, l.crossSellId]));

    // Rule 3: cross sell links, followed up to the max depth.
    const linked = new Set();
    for (const l of leads) {
      if (l.crossSellId === "" || l.crossSellId === l.id || !baseStarted.has(l.crossSellId)) continue;
      let ancestor = l.crossSellId;
      const seen = new Set([l.id]);
      for (let step = 0; step < config.maxCrossSellDepth - 1; step++) {
        const parent = parentOf.get(ancestor) ?? "";
        if (baseStarted.has(parent) && !seen.has(parent) && parent !== ancestor) { seen.add(ancestor); ancestor = parent; }
        else break;
      }
      l.startedIn = baseStarted.get(ancestor);
      l.isAddon = true;
      l.route = ROUTE.CROSS;
      linked.add(l.id);
    }

    // Rule 4: same-session follow-ons (off by default).
    if (followOns) {
      const inSession = leads.filter((l) => l.session !== "").sort(byTimeThenId);
      const firstStarted = new Map();
      const firstIds = new Set();
      for (const l of inSession) {
        if (!firstStarted.has(l.session)) { firstStarted.set(l.session, l.startedIn); firstIds.add(l.id); }
      }
      for (const l of leads) {
        if (l.session === "" || linked.has(l.id) || firstIds.has(l.id)) continue;
        const s = firstStarted.get(l.session);
        if (s !== undefined && s !== l.startedIn) { l.startedIn = s; l.isAddon = true; l.route = ROUTE.FOLLOW; }
      }
    }
    for (const l of leads) l.f_route = l.route;
    return leads;
  }

  // One form start per session per journey, from every row except cross sells,
  // dated to and filtered on the session's first row on that journey.
  function formStarts(prepared) {
    const rows = prepared.filter((r) => !r.isCrossSellType).slice().sort(byTimeThenId);
    const groups = new Map();
    for (const r of rows) {
      const key = (r.session !== "" ? r.session : "row:" + r.id) + "\u0001" + r.journey;
      const g = groups.get(key);
      if (!g) {
        const start = { journey: r.journey, createdAt: r.createdAt, day: r.day, completed: !r.isPartial };
        for (const k in r) if (k.startsWith("f_")) start[k] = r[k];
        groups.set(key, start);
      } else if (!r.isPartial) g.completed = true;
    }
    return Array.from(groups.values());
  }

  function mappingHealth(prepared) {
    const tally = (rows, keyFn) => {
      const m = new Map();
      for (const r of rows) {
        const k = keyFn(r);
        const e = m.get(k) || { value: k, rows: 0, firstSeen: r.createdAt };
        e.rows++;
        e.firstSeen = Math.min(e.firstSeen, r.createdAt);
        m.set(k, e);
      }
      return Array.from(m.values()).sort((a, b) => b.rows - a.rows);
    };
    const partialCommission = prepared.filter((r) => r.isPartial && r.commission !== 0);
    return {
      completedLeads: prepared.filter((r) => !r.isPartial).length,
      partialRows: prepared.filter((r) => r.isPartial).length,
      unmappedFormIds: tally(prepared.filter((r) => r.formId !== "" && r.formHome === null), (r) => r.formId),
      unmappedFormTypes: tally(prepared.filter((r) => r.landed === UNMAPPED), (r) => r.baseType),
      partialWithCommission: partialCommission.length,
      partialCommissionTotal: partialCommission.reduce((s, r) => s + r.commission, 0),
    };
  }

  function build(files, config) {
    const loaded = loadFiles(files, config);
    const prepared = prepareRows(loaded.rows, config);
    return {
      leads: attributeLeads(prepared, config, false),
      leadsWithFollowOns: attributeLeads(prepared, config, true),
      starts: formStarts(prepared),
      health: { ...loaded.health, ...mappingHealth(prepared) },
    };
  }

  // ---- Filters -----------------------------------------------------------
  const FILTERS = [
    { key: "f_source", label: "Traffic source", starts: true },
    { key: "f_campaign_type", label: "Campaign type", starts: true },
    { key: "f_campaign", label: "Campaign", starts: true },
    { key: "f_match_type", label: "Match type", starts: true },
    { key: "f_device", label: "Device", starts: true },
    { key: "f_form", label: "Form", starts: true },
    { key: "f_test_arm", label: "Test arm", starts: true },
    { key: "f_day_of_week", label: "Day of week", starts: true },
    { key: "f_lead_type", label: "Lead type", starts: false },
    { key: "f_route", label: "Route", starts: false },
    { key: "f_buyer", label: "Buyer", starts: false },
    { key: "f_valid", label: "Valid lead", starts: false },
    { key: "f_region", label: "Region", starts: false },
  ];
  const FILTER_BY_KEY = Object.fromEntries(FILTERS.map((f) => [f.key, f]));

  // A selection maps a filter key to a Set of kept values. Missing or null
  // means every value is selected.
  const activeKeys = (sel) => Object.keys(sel).filter((k) => sel[k]);
  const startsAvailable = (sel) => activeKeys(sel).every((k) => FILTER_BY_KEY[k].starts);

  function applyFilters(items, sel, forStarts = false) {
    const keys = activeKeys(sel).filter((k) => !forStarts || FILTER_BY_KEY[k].starts);
    if (!keys.length) return items;
    return items.filter((it) => keys.every((k) => sel[k].has(it[k])));
  }

  // ---- Periods -----------------------------------------------------------
  function lastFullDay(lastTs) {
    const secs = lastTs - dayOf(lastTs) * 86400;
    return secs >= 23 * 3600 + 59 * 60 ? dayOf(lastTs) : dayOf(lastTs) - 1;
  }

  function comparisonRange(start, end, mode) {
    if (mode === "Previous period") { const len = end - start + 1; return [start - len, start - 1]; }
    if (mode === "Same days last month") return [shiftMonths(start, -1), shiftMonths(end, -1)];
    return null;
  }

  function periodStart(day, gran) {
    if (gran === "Week") return day - parts(day).wd;
    if (gran === "Month") return monthStart(day);
    return day;
  }
  function periodEnd(start, gran) {
    if (gran === "Week") return start + 6;
    if (gran === "Month") return monthEnd(start);
    return start;
  }

  function periodLabel(start, gran, rangeStart, rangeEnd) {
    const end = periodEnd(start, gran);
    const shownStart = Math.max(start, rangeStart);
    const shownEnd = Math.min(end, rangeEnd);
    const isPart = shownStart > start || shownEnd < end;
    const p = parts(start);
    if (gran === "Day") return { label: `${WEEKDAYS[p.wd]} ${p.d} ${MONTHS[p.m]} ${p.y}`, isPart: false };
    if (isPart) {
      const a = parts(shownStart), b = parts(shownEnd);
      const first = a.m === b.m && a.y === b.y ? String(a.d) : dayMonth(shownStart);
      return { label: `${first} to ${dayMonth(shownEnd)} ${b.y}`, isPart: true };
    }
    if (gran === "Week") return { label: `w/c ${dayMonth(start)} ${p.y}`, isPart: false };
    return { label: `${MONTHS[p.m]} ${p.y}`, isPart: false };
  }

  function allPeriods(start, end, gran) {
    const out = [];
    for (let d = start; d <= end; d++) { const p = periodStart(d, gran); if (out[out.length - 1] !== p) out.push(p); }
    return out;
  }

  // ---- Figures -----------------------------------------------------------
  const ratio = (a, b) => (b ? a / b : null);
  const SUMS = ["reported_leads", "reported_revenue", "flattened_leads", "flattened_revenue",
    "blended_enquiries", "blended_leads", "blended_revenue",
    "routed_in_leads", "routed_in_revenue", "routed_out_leads", "routed_out_revenue"];

  function emptySums() { const o = {}; for (const k of SUMS) o[k] = 0; return o; }

  function addLead(acc, l, channel) {
    const landed = l.landed === channel;
    const started = l.startedIn === channel;
    const rev = l.commission;
    if (landed) { acc.reported_leads++; acc.reported_revenue += rev; }
    if (landed && started) { acc.flattened_leads++; acc.flattened_revenue += rev; }
    if (started) { acc.blended_leads++; acc.blended_revenue += rev; if (!l.isAddon) acc.blended_enquiries++; }
    if (landed && !started) { acc.routed_in_leads++; acc.routed_in_revenue += rev; }
    if (started && !landed) { acc.routed_out_leads++; acc.routed_out_revenue += rev; }
  }

  function addRatios(row, startsOk) {
    row.reported_rpe = ratio(row.reported_revenue, row.reported_leads);
    row.flattened_rpe = ratio(row.flattened_revenue, row.flattened_leads);
    row.rpe = ratio(row.blended_revenue, row.blended_enquiries);
    if (startsOk) row.form_conversion = ratio(row.form_starts_completed, row.form_starts);
    else { row.form_starts = null; row.form_starts_completed = null; row.form_conversion = null; }
    // Parked: spend and site visits join here as extra fields, for example
    // row.spend, row.cost_per_enquiry, row.site_visits.
    return row;
  }

  function summarise(leads, starts, channel, start, end, startsOk = true) {
    const row = emptySums();
    for (const l of leads) if (l.day >= start && l.day <= end) addLead(row, l, channel);
    row.form_starts = 0; row.form_starts_completed = 0;
    for (const s of starts) {
      if (s.journey === channel && s.day >= start && s.day <= end) { row.form_starts++; if (s.completed) row.form_starts_completed++; }
    }
    return addRatios(row, startsOk);
  }

  function breakdown(leads, starts, channel, start, end, gran, startsOk = true) {
    const periods = allPeriods(start, end, gran);
    const byPeriod = new Map(periods.map((p) => [p, { ...emptySums(), form_starts: 0, form_starts_completed: 0 }]));
    for (const l of leads) {
      if (l.day < start || l.day > end) continue;
      addLead(byPeriod.get(periodStart(l.day, gran)), l, channel);
    }
    for (const s of starts) {
      if (s.journey !== channel || s.day < start || s.day > end) continue;
      const row = byPeriod.get(periodStart(s.day, gran));
      row.form_starts++;
      if (s.completed) row.form_starts_completed++;
    }
    return periods.map((p) => ({ ...addRatios(byPeriod.get(p), startsOk), period: p, ...periodLabel(p, gran, start, end) }));
  }

  function rollingRpe(leads, channel, start, end, window = 7) {
    const from = start - (window - 1);
    const rev = new Map(), enq = new Map();
    for (const l of leads) {
      if (l.day < from || l.day > end || l.startedIn !== channel) continue;
      rev.set(l.day, (rev.get(l.day) || 0) + l.commission);
      if (!l.isAddon) enq.set(l.day, (enq.get(l.day) || 0) + 1);
    }
    const out = [];
    for (let d = start; d <= end; d++) {
      let r = 0, e = 0;
      for (let k = d - window + 1; k <= d; k++) { r += rev.get(k) || 0; e += enq.get(k) || 0; }
      out.push({ day: d, rpe: e ? r / e : null });
    }
    return out;
  }

  // Customers who started in one journey and landed as another product, and
  // what that does to both channels. A row per period plus a total.
  function routedJourney(leads, from, to, start, end, gran) {
    const blank = () => ({
      from_enquiries: 0, from_revenue: 0, kept_leads: 0, kept_revenue: 0,
      routed_leads: 0, routed_enquiries: 0, routed_revenue: 0, to_reported_leads: 0, to_reported_revenue: 0,
    });
    const periods = allPeriods(start, end, gran);
    const byPeriod = new Map(periods.map((p) => [p, blank()]));
    const total = blank();
    for (const l of leads) {
      if (l.day < start || l.day > end) continue;
      for (const acc of [byPeriod.get(periodStart(l.day, gran)), total]) {
        if (l.startedIn === from) {
          if (!l.isAddon) acc.from_enquiries++;
          acc.from_revenue += l.commission;
          if (l.landed === from) { acc.kept_leads++; acc.kept_revenue += l.commission; }
          if (l.landed === to) { acc.routed_leads++; acc.routed_revenue += l.commission; if (!l.isAddon) acc.routed_enquiries++; }
        }
        if (l.landed === to) { acc.to_reported_leads++; acc.to_reported_revenue += l.commission; }
      }
    }
    const finish = (r) => {
      r.from_rpe = ratio(r.from_revenue, r.from_enquiries);
      r.kept_rpe = ratio(r.kept_revenue, r.kept_leads);
      r.routed_rpe = ratio(r.routed_revenue, r.routed_leads);
      r.routed_share = ratio(r.routed_enquiries, r.from_enquiries);
      r.to_reported_rpe = ratio(r.to_reported_revenue, r.to_reported_leads);
      r.to_without_leads = r.to_reported_leads - r.routed_leads;
      r.to_without_revenue = r.to_reported_revenue - r.routed_revenue;
      r.to_without_rpe = ratio(r.to_without_revenue, r.to_without_leads);
      r.lead_uplift = ratio(r.routed_leads, r.to_without_leads);
      r.revenue_uplift = ratio(r.routed_revenue, r.to_without_revenue);
      r.rpe_effect = r.to_reported_rpe === null || r.to_without_rpe === null ? null : r.to_reported_rpe - r.to_without_rpe;
      return r;
    };
    return {
      total: finish(total),
      rows: periods.map((p) => ({ ...finish(byPeriod.get(p)), period: p, ...periodLabel(p, gran, start, end) })),
    };
  }

  function routingDetail(leads, channel, start, end) {
    const out = new Map(), inward = new Map();
    for (const l of leads) {
      if (l.day < start || l.day > end) continue;
      if (l.startedIn === channel && l.landed !== channel) {
        const e = out.get(l.landed) || { leads: 0, addons: 0 };
        e.leads++; if (l.isAddon) e.addons++;
        out.set(l.landed, e);
      } else if (l.landed === channel && l.startedIn !== channel) {
        inward.set(l.startedIn, (inward.get(l.startedIn) || 0) + 1);
      }
    }
    return { out, inward };
  }

  const pctChange = (cur, prev) => (cur === null || prev === null || prev === 0 ? null : ((cur - prev) / prev) * 100);
  const ppChange = (cur, prev) => (cur === null || prev === null ? null : (cur - prev) * 100);

  // ---- Acceptance checks (brief section 10) -------------------------------
  function acceptanceChecks(model) {
    const d = dayFromISO;
    const SEP = [d("2026-09-01"), d("2026-09-30")];
    const OCT = [d("2026-10-01"), d("2026-10-20")];
    const ALL = [d("2026-06-01"), d("2026-10-21")];
    const { leads, starts } = model;
    const inR = (arr, [a, b]) => arr.filter((x) => x.day >= a && x.day <= b);
    const sum = (arr) => arr.reduce((s, l) => s + l.commission, 0);
    const moved = (arr, from, to) => arr.filter((l) => l.startedIn === from && l.landed === to);
    const s = (ch, r, ls = leads, ss = starts, ok = true) => summarise(ls, ss, ch, r[0], r[1], ok);
    const money = (x) => "£" + (x ?? 0).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const n = (x) => (x ?? 0).toLocaleString("en-GB");
    const r2 = (x) => (x === null ? null : Math.round(x * 100) / 100);
    const close = (a, b) => a !== null && Math.abs(a - b) < 0.005;
    const checks = [];
    const add = (name, expected, actual, pass) => checks.push({ name, expected, actual, pass });

    const all = inR(leads, ALL);
    add("Completed leads, 1 Jun to 21 Oct", "23,723", n(all.length), all.length === 23723);
    add("Revenue, 1 Jun to 21 Oct", "£2,118,521.33", money(sum(all)), close(sum(all), 2118521.33));

    const ll = s("Leased Lines", SEP);
    add("Leased Lines, Sep, blended", "168 enquiries, £38,529.00, RPE £229.34",
      `${n(ll.blended_enquiries)} enquiries, ${money(ll.blended_revenue)}, RPE ${money(ll.rpe)}`,
      ll.blended_enquiries === 168 && close(ll.blended_revenue, 38529) && close(r2(ll.rpe), 229.34));
    add("Leased Lines, Sep, reported", "132 leads, £36,750.00, RPE £278.41",
      `${n(ll.reported_leads)} leads, ${money(ll.reported_revenue)}, RPE ${money(ll.reported_rpe)}`,
      ll.reported_leads === 132 && close(ll.reported_revenue, 36750) && close(r2(ll.reported_rpe), 278.41));
    const llBb = moved(inR(leads, SEP), "Leased Lines", "Broadband");
    add("Leased Lines, Sep, routed to broadband", "36 leads, £1,779.00", `${n(llBb.length)} leads, ${money(sum(llBb))}`,
      llBb.length === 36 && close(sum(llBb), 1779));
    add("Leased Lines, Sep, form starts", "509, of which 165 completed",
      `${n(ll.form_starts)}, of which ${n(ll.form_starts_completed)} completed`,
      ll.form_starts === 509 && ll.form_starts_completed === 165);

    const bb = s("Broadband", SEP);
    add("Broadband, Sep, reported", "1,792 leads, £85,401.50, RPE £47.66",
      `${n(bb.reported_leads)} leads, ${money(bb.reported_revenue)}, RPE ${money(bb.reported_rpe)}`,
      bb.reported_leads === 1792 && close(bb.reported_revenue, 85401.5) && close(r2(bb.reported_rpe), 47.66));
    add("Broadband, Sep, flattened", "1,756 leads, £83,622.50, RPE £47.62",
      `${n(bb.flattened_leads)} leads, ${money(bb.flattened_revenue)}, RPE ${money(bb.flattened_rpe)}`,
      bb.flattened_leads === 1756 && close(bb.flattened_revenue, 83622.5) && close(r2(bb.flattened_rpe), 47.62));

    const bbOct = s("Broadband", OCT);
    add("Broadband, 1 to 20 Oct, blended", "1,110 enquiries, £56,889.50, RPE £51.25",
      `${n(bbOct.blended_enquiries)} enquiries, ${money(bbOct.blended_revenue)}, RPE ${money(bbOct.rpe)}`,
      bbOct.blended_enquiries === 1110 && close(bbOct.blended_revenue, 56889.5) && close(r2(bbOct.rpe), 51.25));
    const xs = moved(inR(leads, OCT), "Broadband", "Energy");
    add("Broadband, 1 to 20 Oct, energy cross sells", "83 leads, £4,357.50", `${n(xs.length)} leads, ${money(sum(xs))}`,
      xs.length === 83 && close(sum(xs), 4357.5));

    const en = s("Energy", OCT);
    add("Energy, 1 to 20 Oct, reported", "777 leads, £141,823.38, RPE £182.53",
      `${n(en.reported_leads)} leads, ${money(en.reported_revenue)}, RPE ${money(en.reported_rpe)}`,
      en.reported_leads === 777 && close(en.reported_revenue, 141823.38) && close(r2(en.reported_rpe), 182.53));
    add("Energy, 1 to 20 Oct, blended", "694 enquiries, £137,465.88, RPE £198.08",
      `${n(en.blended_enquiries)} enquiries, ${money(en.blended_revenue)}, RPE ${money(en.rpe)}`,
      en.blended_enquiries === 694 && close(en.blended_revenue, 137465.88) && close(r2(en.rpe), 198.08));

    const mob = { f_device: new Set(["Mobile"]) };
    const mLeads = applyFilters(leads, mob), mStarts = applyFilters(starts, mob, true);
    const llm = s("Leased Lines", SEP, mLeads, mStarts, startsAvailable(mob));
    const mRouted = moved(inR(mLeads, SEP), "Leased Lines", "Broadband").length;
    add("Leased Lines, Sep, filtered to Mobile", "51 enquiries, £10,274.50, 18 routed to broadband, 102 form starts",
      `${n(llm.blended_enquiries)} enquiries, ${money(llm.blended_revenue)}, ${n(mRouted)} routed to broadband, ${n(llm.form_starts)} form starts`,
      llm.blended_enquiries === 51 && close(llm.blended_revenue, 10274.5) && mRouted === 18 && llm.form_starts === 102);

    const fg = { f_buyer: new Set(["Focus Group"]) };
    const llf = s("Leased Lines", SEP, applyFilters(leads, fg), starts, startsAvailable(fg));
    add("Leased Lines, Sep, filtered to buyer Focus Group", "83 leads, £25,730.00, form starts not available",
      `${n(llf.blended_leads)} leads, ${money(llf.blended_revenue)}, form starts ${llf.form_starts === null ? "not available" : n(llf.form_starts)}`,
      llf.blended_leads === 83 && close(llf.blended_revenue, 25730) && llf.form_starts === null);

    const channels = [...new Set(leads.flatMap((l) => [l.landed, l.startedIn]))];
    let balanced = true;
    for (const sel of [{}, mob, fg]) {
      const ls = applyFilters(leads, sel);
      for (const r of [SEP, OCT, ALL]) {
        let rep = 0, bl = 0;
        for (const ch of channels) { const x = s(ch, r, ls); rep += x.reported_revenue; bl += x.blended_revenue; }
        if (Math.abs(rep - bl) > 0.005) balanced = false;
      }
    }
    add("Reported total equals blended total", "Same for any date range and filter", balanced ? "Same" : "Different", balanced);
    return checks;
  }

  return {
    UNMAPPED, UNKNOWN, NOT_AN_EXPORT, ROUTE, FILTERS, FILTER_BY_KEY, MONTHS,
    parseCSV, headerOf, isLeadExport, parseDate, parseMoney, normId,
    dayOf, dayFromISO, isoFromDay, parts, fullDate, dayMonth,
    loadFiles, dedupe, prepareRows, attributeLeads, formStarts, mappingHealth, build,
    applyFilters, startsAvailable, activeKeys,
    lastFullDay, comparisonRange, periodStart, periodLabel, allPeriods,
    summarise, breakdown, rollingRpe, routingDetail, routedJourney, pctChange, ppChange, acceptanceChecks,
  };
})();
if (typeof module !== "undefined") module.exports = Engine;
// ENGINE END
</script>

<script>
// ===================================================================
// Page
// ===================================================================
(() => {
  const E = Engine;
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- Formatting --------------------------------------------------------
  const NA = "n/a";
  const NOT_AVAILABLE = "Not available with this filter";
  const gb = (x, min, max) => x.toLocaleString("en-GB", { minimumFractionDigits: min, maximumFractionDigits: max });
  const fmt = {
    money: (v) => (v === null || v === undefined ? NA : (v < 0 ? "-" : "") + "£" + gb(Math.abs(v), 2, 2)),
    moneyWhole: (v) => (v === null || v === undefined ? NA : (v < 0 ? "-" : "") + "£" + gb(Math.abs(v), 0, 0)),
    moneyK: (v) => (v === null || v === undefined ? NA : (v < 0 ? "-" : "") + "£" + gb(Math.abs(v) / 1000, 1, 1) + "k"),
    count: (v) => (v === null || v === undefined ? NA : gb(Math.round(v), 0, 0)),
    percent: (v) => (v === null || v === undefined ? NA : gb(v * 100, 1, 1) + "%"),
  };
  function deltaHtml(change, unit) {
    if (change === null) return `<span class="delta flat" title="No comparison figure">no comparison</span>`;
    const rounded = unit === "pp" ? Math.round(change * 10) / 10 : Math.round(change);
    const cls = rounded > 0 ? "up" : rounded < 0 ? "down" : "flat";
    const arrow = rounded > 0 ? "▲" : rounded < 0 ? "▼" : "▶";
    const num = unit === "pp" ? gb(Math.abs(rounded), 1, 1) + "pp" : gb(Math.abs(rounded), 0, 0) + "%";
    return `<span class="delta ${cls}">${arrow} ${num}</span>`;
  }

  const DEFINITIONS = [
    ["Enquiry", "A completed lead that started a journey. Partial leads (<code>formType</code> starting <code>partial-</code>) never count."],
    ["Add-on", "A completed lead that rides on another one, such as an energy cross sell after a broadband quote. Its revenue counts, but it isn't an extra enquiry."],
    ["Started in", "The journey the customer began in, taken from the form they were on."],
    ["Landed as", "The product the lead was recorded as."],
    ["Reported", "Figures by what the lead landed as. This is how channels report today."],
    ["Flattened", "Reported, minus leads that started in another journey."],
    ["Blended", "Everything a journey's enquiries earned, wherever they landed. This is the headline number."],
    ["RPE", "Revenue per enquiry: blended revenue ÷ blended enquiries."],
    ["Form starts", "Unique sessions that landed on a journey's form. This is the volume measure until site visits are available."],
    ["Form conversion", "Form starts that produced a completed lead ÷ form starts."],
  ];

  // Card figures. Spend and site visits drop in here later as extra entries.
  const CARD_FIGURES = [
    { label: "Revenue", key: "blended_revenue", format: fmt.moneyK, unit: "%" },
    { label: "Enquiries", key: "blended_enquiries", format: fmt.count, unit: "%" },
    { label: "RPE", key: "rpe", format: fmt.money, unit: "%" },
    { label: "Form starts", key: "form_starts", format: fmt.count, unit: "%", starts: true },
    { label: "Form conversion", key: "form_conversion", format: fmt.percent, unit: "pp", starts: true },
  ];

  const BREAKDOWN_GROUPS = [
    { title: "Reported", cols: [["Leads", "reported_leads", fmt.count], ["Revenue", "reported_revenue", fmt.money], ["RPE", "reported_rpe", fmt.money]] },
    { title: "Flattened", cols: [["Leads", "flattened_leads", fmt.count], ["Revenue", "flattened_revenue", fmt.money], ["RPE", "flattened_rpe", fmt.money]] },
    { title: "Blended", cols: [["Enquiries", "blended_enquiries", fmt.count], ["Revenue", "blended_revenue", fmt.money], ["RPE", "rpe", fmt.money]] },
    { title: "Routed in", cols: [["Leads", "routed_in_leads", fmt.count], ["Revenue", "routed_in_revenue", fmt.money]] },
    { title: "Routed out", cols: [["Leads", "routed_out_leads", fmt.count], ["Revenue", "routed_out_revenue", fmt.money]] },
    { title: "Form starts", cols: [["Starts", "form_starts", fmt.count, true], ["Conversion", "form_conversion", fmt.percent, true]] },
  ];

  // ---- Storage (IndexedDB, on this machine only) ------------------------
  const store = (() => {
    let dbp = null;
    let memory = null;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open("blended-rpe", 1); } catch (e) { reject(e); return; }
        req.onupgradeneeded = () => req.result.createObjectStore("exports", { keyPath: "name" });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbp;
    }
    async function tx(mode, fn) {
      const db = await open();
      return new Promise((resolve, reject) => {
        const t = db.transaction("exports", mode);
        const out = fn(t.objectStore("exports"));
        t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : undefined);
        t.onerror = () => reject(t.error);
      });
    }
    return {
      persistent: true,
      async all() {
        if (memory) return [...memory.values()];
        try { return (await tx("readonly", (s) => s.getAll())) || []; }
        catch (e) { memory = new Map(); this.persistent = false; return []; }
      },
      async put(rec) {
        if (memory) { memory.set(rec.name, rec); return; }
        try { await tx("readwrite", (s) => s.put(rec)); }
        catch (e) { memory = memory || new Map(); this.persistent = false; memory.set(rec.name, rec); }
      },
      async remove(name) {
        if (memory) { memory.delete(name); return; }
        await tx("readwrite", (s) => s.delete(name));
      },
    };
  })();

  function hash(text) {
    // 53 bit string hash (cyrb53). Used to spot the same file uploaded twice.
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < text.length; i++) {
      const ch = text.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16) + ":" + text.length;
  }

  // ---- State -------------------------------------------------------------
  const state = {
    files: [], model: null, filterOptions: {},
    start: null, end: null, gran: "Day", compare: "Previous period",
    channels: [...CONFIG.dashboardChannels], followOns: false,
    routeFrom: "Leased Lines", routeTo: "Broadband",
    selection: {}, openHealth: false, messages: [], filterSearch: {},
  };
  let channelOrder = [];

  function busy(on, text) {
    $("#busy").style.display = on ? "flex" : "none";
    if (text) $("#busyText").textContent = text;
  }
  const nextFrame = () => new Promise((r) => setTimeout(r, 30));

  async function reprocess() {
    busy(true, "Processing lead exports...");
    await nextFrame();
    try {
      state.files = await store.all();
      state.model = E.build(state.files.map((f) => ({ name: f.name, text: f.text })), CONFIG);
      const m = state.model;
      state.filterOptions = {};
      for (const f of E.FILTERS) {
        const values = new Set();
        for (const l of m.leads) values.add(l[f.key]);
        if (f.key === "f_route") for (const l of m.leadsWithFollowOns) values.add(l[f.key]);
        if (f.starts) for (const s of m.starts) values.add(s[f.key]);
        state.filterOptions[f.key] = [...values].sort((a, b) => String(a).localeCompare(String(b), "en-GB", { numeric: true }));
        // Drop values that no longer exist from any active filter.
        if (state.selection[f.key]) {
          state.selection[f.key] = new Set([...state.selection[f.key]].filter((v) => values.has(v)));
        }
      }
      const all = new Set([...m.leads.map((l) => l.landed), ...m.leads.map((l) => l.startedIn)]);
      channelOrder = [...new Set([...CONFIG.dashboardChannels, ...CONFIG.channels.map((c) => c.name), ...[...all].sort()])];
      if (m.leads.length) {
        const last = E.lastFullDay(m.health.coverage[1]);
        const first = E.dayOf(m.health.coverage[0]);
        if (state.start === null || state.end > last || state.start < first) {
          state.end = Math.max(last, first);
          const p = E.parts(state.end);
          state.start = Math.max(Date.UTC(p.y, p.m, 1) / 86400000, first);
        }
      }
    } finally {
      busy(false);
    }
    renderSidebar();
    renderMain();
  }

  // ---- Uploads -----------------------------------------------------------
  async function handleFiles(fileList) {
    const files = [...fileList];
    if (!files.length) return;
    busy(true, "Reading files...");
    const existing = await store.all();
    const byHash = new Map(existing.map((f) => [f.hash, f.name]));
    const names = new Set(existing.map((f) => f.name));
    const messages = [];
    let saved = 0;
    for (const file of files) {
      let text;
      try { text = await file.text(); } catch (e) { messages.push({ cls: "err", text: `${file.name}: couldn't be read` }); continue; }
      if (!E.isLeadExport(E.headerOf(text))) {
        messages.push({ cls: "err", text: `${file.name}: ${E.NOT_AN_EXPORT}` });
        continue;
      }
      const h = hash(text);
      if (byHash.has(h)) {
        messages.push({ cls: "info", text: `${file.name}: already uploaded as ${byHash.get(h)}. Nothing changed.` });
        continue;
      }
      let name = file.name;
      if (names.has(name)) name = name.replace(/(\.csv)?$/i, `-${h.slice(0, 6)}$1`);
      await store.put({ name, hash: h, text, size: text.length, addedAt: Date.now() });
      byHash.set(h, name); names.add(name);
      const rows = Math.max(0, text.split(/\r?\n/).filter((l) => l !== "").length - 1);
      messages.push({ cls: "ok", text: `${file.name}: saved (about ${rows.toLocaleString("en-GB")} rows)` });
      saved++;
    }
    state.messages = messages;
    if (saved) {
      state.openHealth = true;
      await reprocess();
    } else {
      busy(false);
      renderUploadMessages();
    }
  }

  async function removeFile(name) {
    if (!confirm(`Remove ${name}? Its leads will drop out unless another export also covers them.`)) return;
    await store.remove(name);
    state.messages = [{ cls: "info", text: `Removed ${name}` }];
    state.openHealth = true;
    await reprocess();
  }

  function renderUploadMessages() {
    const box = $("#uploadMsgs");
    box.innerHTML = state.messages.map((m) => `<div class="msg ${m.cls}">${esc(m.text)}</div>`).join("") +
      (store.persistent ? "" : `<div class="msg warn">This browser won't keep uploads between visits. Open the file in Chrome or Edge to keep them.</div>`);
  }

  // ---- Sidebar -----------------------------------------------------------
  function renderSidebar() {
    renderUploadMessages();
    const files = state.model ? state.model.health.files : [];
    $("#fileCount").textContent = files.length;
    $("#fileList").innerHTML = files.length ? files.map((f) => `
      <li><div><strong>${esc(f.name)}</strong><br><span class="muted small">${
        f.from !== null ? `${E.fullDate(f.from)} to ${E.fullDate(f.to)}` : "No dated rows"}, ${f.rows.toLocaleString("en-GB")} rows${f.excel ? ", re-saved in Excel" : ""}</span></div>
        <button class="btn small" data-remove="${esc(f.name)}">Remove</button></li>`).join("")
      : `<li><div class="muted">No exports uploaded yet.</div></li>`;
    $("#fileList").querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => removeFile(b.dataset.remove)));

    const c = $("#controls");
    if (!state.model || !state.model.leads.length) { c.innerHTML = ""; return; }
    const first = E.dayOf(state.model.health.coverage[0]);
    const last = E.lastFullDay(state.model.health.coverage[1]);
    c.innerHTML = `
      <h3>View</h3>
      <label class="field">Date range</label>
      <div class="row">
        <input type="date" id="dStart" value="${E.isoFromDay(state.start)}" min="${E.isoFromDay(first)}" max="${E.isoFromDay(last)}" aria-label="From">
        <input type="date" id="dEnd" value="${E.isoFromDay(state.end)}" min="${E.isoFromDay(first)}" max="${E.isoFromDay(Math.max(last, first))}" aria-label="To">
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn small" data-preset="mtd">Month to date</button>
        <button class="btn small" data-preset="lastmonth">Last month</button>
        <button class="btn small" data-preset="all">All</button>
      </div>
      <label class="field">Granularity</label>
      <div class="seg" id="gran">${["Day", "Week", "Month"].map((g) => `<button aria-pressed="${state.gran === g}" data-g="${g}">${g}</button>`).join("")}</div>
      <label class="field" for="compare">Compare with</label>
      <select id="compare">${["Previous period", "Same days last month", "Nothing"].map((o) => `<option ${o === state.compare ? "selected" : ""}>${o}</option>`).join("")}</select>
      <label class="field">Channels</label>
      <div id="channelBox">${channelOrder.map((ch) => `<label class="check"><input type="checkbox" value="${esc(ch)}" ${state.channels.includes(ch) ? "checked" : ""}>${esc(ch)}</label>`).join("")}</div>
      <label class="check" style="margin-top:10px" title="Later leads in a session with no cross sell link take the journey of the session's first lead and count as add-ons.">
        <input type="checkbox" id="followOns" ${state.followOns ? "checked" : ""}> Include same-session follow-ons</label>
      <h3>Filters <button class="btn link small" id="resetFilters">Reset</button></h3>
      <div id="filters"></div>`;

    $("#dStart").addEventListener("change", (e) => { if (e.target.value) { state.start = E.dayFromISO(e.target.value); if (state.start > state.end) state.end = state.start; renderSidebar(); renderMain(); } });
    $("#dEnd").addEventListener("change", (e) => { if (e.target.value) { state.end = E.dayFromISO(e.target.value); if (state.end < state.start) state.start = state.end; renderSidebar(); renderMain(); } });
    c.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
      const p = E.parts(last);
      if (b.dataset.preset === "mtd") { state.end = last; state.start = Math.max(first, Date.UTC(p.y, p.m, 1) / 86400000); }
      if (b.dataset.preset === "lastmonth") { state.start = Math.max(first, Date.UTC(p.y, p.m - 1, 1) / 86400000); state.end = Date.UTC(p.y, p.m, 0) / 86400000; }
      if (b.dataset.preset === "all") { state.start = first; state.end = last; }
      renderSidebar(); renderMain();
    }));
    c.querySelectorAll("#gran button").forEach((b) => b.addEventListener("click", () => { state.gran = b.dataset.g; renderSidebar(); renderMain(); }));
    $("#compare").addEventListener("change", (e) => { state.compare = e.target.value; renderMain(); });
    c.querySelectorAll("#channelBox input").forEach((i) => i.addEventListener("change", () => {
      state.channels = [...c.querySelectorAll("#channelBox input:checked")].map((x) => x.value);
      renderMain();
    }));
    $("#followOns").addEventListener("change", (e) => { state.followOns = e.target.checked; renderMain(); });
    $("#resetFilters").addEventListener("click", () => { state.selection = {}; renderFilters(); renderMain(); });
    renderFilters();
  }

  function renderFilters() {
    const box = $("#filters");
    const openKeys = new Set([...box.querySelectorAll("details[open]")].map((d) => d.dataset.key));
    box.innerHTML = E.FILTERS.map((f) => {
      const options = state.filterOptions[f.key] || [];
      const sel = state.selection[f.key];
      const status = sel ? `${sel.size} of ${options.length}` : "All";
      const q = (state.filterSearch[f.key] || "").toLowerCase();
      const shown = q ? options.filter((o) => String(o).toLowerCase().includes(q)) : options;
      return `<details class="filter ${sel ? "active" : ""}" data-key="${f.key}" ${openKeys.has(f.key) ? "open" : ""}>
        <summary><span>${f.label}</span><span>${status}</span></summary>
        <div class="body">
          <div class="row"><button class="btn small" data-all>Select all</button><button class="btn small" data-none>Clear</button></div>
          ${options.length > 10 ? `<input type="search" placeholder="Search" value="${esc(state.filterSearch[f.key] || "")}" style="margin-top:6px">` : ""}
          <div class="values">${shown.map((o) => `<label class="check"><input type="checkbox" value="${esc(o)}" ${!sel || sel.has(o) ? "checked" : ""}>${esc(o)}</label>`).join("")}</div>
          ${f.starts ? "" : `<div class="note">Form starts can't be filtered on this field, so they show as not available while it's set.</div>`}
        </div></details>`;
    }).join("");
    box.querySelectorAll("details.filter").forEach((d) => {
      const key = d.dataset.key;
      const options = state.filterOptions[key] || [];
      const commit = (set) => {
        state.selection[key] = set.size === options.length ? null : set;
        renderFilters(); renderMain();
      };
      d.querySelector("[data-all]").addEventListener("click", () => commit(new Set(options)));
      d.querySelector("[data-none]").addEventListener("click", () => commit(new Set()));
      d.querySelectorAll(".values input").forEach((i) => i.addEventListener("change", () => {
        const set = new Set(state.selection[key] || options);
        const value = options.find((o) => String(o) === i.value);
        if (i.checked) set.add(value); else set.delete(value);
        commit(set);
      }));
      const search = d.querySelector("input[type=search]");
      if (search) search.addEventListener("input", () => {
        state.filterSearch[key] = search.value;
        renderFilters();
        const again = box.querySelector(`details[data-key="${key}"] input[type=search]`);
        again.focus(); again.setSelectionRange(again.value.length, again.value.length);
      });
    });
  }

  // ---- Main --------------------------------------------------------------
  function describeFilters() {
    return E.activeKeys(state.selection).map((k) => {
      const vals = [...state.selection[k]].sort();
      const label = E.FILTER_BY_KEY[k].label;
      if (!vals.length) return `${label}: none`;
      return `${label}: ${vals.slice(0, 3).join(", ")}${vals.length > 3 ? ` and ${vals.length - 3} more` : ""}`;
    }).join("; ");
  }

  function routingLine(detail) {
    const parts = [];
    for (const [landed, e] of detail.out) {
      if (e.addons === 0) parts.push(`Includes ${fmt.count(e.leads)} enquiries that landed as ${landed}`);
      else if (e.addons === e.leads) parts.push(`Includes ${fmt.count(e.leads)} add-on leads that landed as ${landed}`);
      else parts.push(`Includes ${fmt.count(e.leads)} leads that landed as ${landed} (${fmt.count(e.addons)} add-ons)`);
    }
    for (const [started, n] of detail.inward) parts.push(`Excludes ${fmt.count(n)} leads that started in ${started}`);
    return parts.length ? parts.join(". ") + "." : "No leads moved in or out of this journey in this period.";
  }

  const colourOf = (ch) => `var(--series-${(channelOrder.indexOf(ch) % 8) + 1})`;

  function breakdownTable(table, startsOk) {
    const head1 = `<tr><th rowspan="2">Period</th>${BREAKDOWN_GROUPS.map((g) => `<th class="group" colspan="${g.cols.length}">${g.title}</th>`).join("")}</tr>`;
    const head2 = `<tr>${BREAKDOWN_GROUPS.map((g) => g.cols.map((c) => `<th>${c[0]}</th>`).join("")).join("")}</tr>`;
    const body = table.map((r) => `<tr class="${r.isPart ? "part" : ""}"><td>${esc(r.label)}</td>${BREAKDOWN_GROUPS.map((g) => g.cols.map(([, key, f, st]) =>
      st && !startsOk ? `<td class="na">${NOT_AVAILABLE}</td>` : `<td>${f(r[key])}</td>`).join("")).join("")}</tr>`).join("");
    return `<div class="tablewrap"><table><thead>${head1}${head2}</thead><tbody>${body}</tbody></table></div>`;
  }

  function healthPanel(h) {
    const flagged = h.unmappedFormIds.length || h.unmappedFormTypes.length;
    const open = state.openHealth || flagged;
    state.openHealth = false;
    const [first, last] = h.coverage;
    const cov = first !== null ? `${E.fullDate(E.dayOf(first))} to ${E.fullDate(E.dayOf(last))}` : "None";
    const stat = (label, value, flag) => `<div class="stat ${flag ? "flagged" : ""}"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    const list = (rows, title) => `<div class="tablewrap"><table><thead><tr><th>${title}</th><th>Rows</th><th>First seen</th></tr></thead><tbody>${
      rows.map((r) => `<tr><td>${esc(r.value)}</td><td>${fmt.count(r.rows)}</td><td>${E.fullDate(E.dayOf(r.firstSeen))}</td></tr>`).join("")}</tbody></table></div>`;
    return `<details class="panel" id="healthPanel" ${open ? "open" : ""}>
      <summary>Data health${flagged ? `<span class="flag">⚠ Mapping needs updating</span>` : ""}</summary>
      <div class="body">
        <div class="grid4">
          ${stat("Files loaded", fmt.count(h.files.length))}
          ${stat("Date coverage", cov)}
          ${stat("Rows after dedupe", fmt.count(h.rowsAfterDedupe))}
          ${stat("Duplicates removed", fmt.count(h.duplicatesRemoved))}
          ${stat("Unmapped form ids", (h.unmappedFormIds.length ? "⚠ " : "") + fmt.count(h.unmappedFormIds.length), h.unmappedFormIds.length)}
          ${stat("Unmapped form types", (h.unmappedFormTypes.length ? "⚠ " : "") + fmt.count(h.unmappedFormTypes.length), h.unmappedFormTypes.length)}
          ${stat("Partial rows carrying commission", fmt.count(h.partialWithCommission) + ` <span class="small muted">(${fmt.money(h.partialCommissionTotal)}, excluded)</span>`)}
          ${stat("Completed leads", fmt.count(h.completedLeads))}
        </div>
        ${h.unmappedFormIds.length ? `<div class="msg warn">These form ids aren't in CONFIG. Their leads fall back to the channel they landed as. Add them to the right channel's formIds at the top of this file.</div>${list(h.unmappedFormIds, "Form id")}` : ""}
        ${h.unmappedFormTypes.length ? `<div class="msg warn">These form types aren't in CONFIG, so their leads show as Unmapped. Add them to the right channel's formTypes at the top of this file.</div>${list(h.unmappedFormTypes, "Form type")}` : ""}
        ${h.unreadableDates ? `<div class="msg err">${fmt.count(h.unreadableDates)} rows had a created_at date that couldn't be read and were skipped.</div>` : ""}
        ${h.rowsBeforeStart ? `<p class="small muted">${fmt.count(h.rowsBeforeStart)} rows from before ${E.fullDate(E.dayFromISO(CONFIG.startDate))} were ignored.</p>` : ""}
      </div></details>`;
  }

  function checksPanel() {
    return `<details class="panel" id="checksPanel"><summary>Acceptance checks</summary><div class="body">
      <p class="small muted">The checks from the build brief. They only pass with exports covering 1 June to 21 October 2026. Filters and dates on this page don't affect them.</p>
      <button class="btn" id="runChecks">Run checks</button><div id="checksOut"></div></div></details>`;
  }

  function runChecks() {
    const results = E.acceptanceChecks(state.model);
    const passed = results.filter((r) => r.pass).length;
    $("#checksOut").innerHTML = `<p><strong>${passed} of ${results.length} passed</strong></p>
      <div class="tablewrap"><table><thead><tr><th>Check</th><th>Expected</th><th>Dashboard</th><th>Result</th></tr></thead><tbody>${
      results.map((r) => `<tr><td>${esc(r.name)}</td><td>${esc(r.expected)}</td><td>${esc(r.actual)}</td><td class="${r.pass ? "pass" : "fail"}">${r.pass ? "✓ Pass" : "✗ Fail"}</td></tr>`).join("")}</tbody></table></div>`;
  }

  const signedMoney = (v) => (v === null ? NA : (v > 0 ? "+" : v < 0 ? "-" : "") + "£" + gb(Math.abs(v), 2, 2));
  const signedPct = (v) => (v === null ? NA : (v > 0 ? "+" : v < 0 ? "-" : "") + gb(Math.abs(v * 100), 0, 0) + "%");

  const ROUTED_COLUMNS = [
    ["Enquiries started in FROM", "from_enquiries", fmt.count],
    ["Routed to TO", "routed_leads", fmt.count],
    ["Share routed", "routed_share", fmt.percent],
    ["Routed revenue", "routed_revenue", fmt.money],
    ["Routed RPE", "routed_rpe", fmt.money],
    ["FROM RPE without routed", "kept_rpe", fmt.money],
    ["FROM blended RPE", "from_rpe", fmt.money],
    ["TO reported leads", "to_reported_leads", fmt.count],
    ["TO reported RPE", "to_reported_rpe", fmt.money],
    ["TO leads without routed", "to_without_leads", fmt.count],
    ["TO RPE without routed", "to_without_rpe", fmt.money],
    ["TO lead uplift", "lead_uplift", signedPct],
    ["TO revenue uplift", "revenue_uplift", signedPct],
  ];
  const routedLabel = (label, from, to) => label.replace("FROM", from).replace("TO", to);

  function routedPanel(leads) {
    const { start, end, gran, routeFrom: from, routeTo: to } = state;
    const r = E.routedJourney(leads, from, to, start, end, gran);
    lastRender.routed = r;
    const t = r.total;
    const opts = (cur, skip) => channelOrder.filter((c) => c !== skip && c !== E.UNMAPPED)
      .map((c) => `<option ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("");
    const kv = (label, value, key) => `<div class="kv ${key ? "key" : ""}"><span>${label}</span><span>${value}</span></div>`;
    const addons = t.routed_leads - t.routed_enquiries;
    const who = addons === 0
      ? `${fmt.count(t.routed_enquiries)} of ${fmt.count(t.from_enquiries)} ${esc(from)} enquiries (${fmt.percent(t.routed_share)})`
      : t.routed_enquiries === 0
        ? `${fmt.count(addons)} add-on leads (such as cross sells) from ${esc(from)} customers`
        : `${fmt.count(t.routed_leads)} leads from ${esc(from)} customers (${fmt.count(t.routed_enquiries)} enquiries and ${fmt.count(addons)} add-ons)`;
    const summary = t.routed_leads
      ? `${who} landed as ${esc(to)}, earning ${fmt.money(t.routed_revenue)} (${fmt.money(t.routed_rpe)} a lead).
         ${esc(to)} reports them as its own, which adds ${signedPct(t.lead_uplift)} to its leads and ${signedPct(t.revenue_uplift)} to its revenue${
           t.rpe_effect !== null ? ` and moves its RPE by ${signedMoney(t.rpe_effect)}` : ""}.`
      : `No ${esc(from)} customers landed as ${esc(to)} in this period.`;
    const table = `<div class="tablewrap"><table><thead><tr><th>Period</th>${ROUTED_COLUMNS.map(([l]) => `<th>${esc(routedLabel(l, from, to))}</th>`).join("")}</tr></thead><tbody>${
      r.rows.map((row) => `<tr class="${row.isPart ? "part" : ""}"><td>${esc(row.label)}</td>${ROUTED_COLUMNS.map(([, k, f]) => `<td>${f(row[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    return `<section class="card routed" id="routedPanel">
      <div class="card-head" style="justify-content:space-between;flex-wrap:wrap">
        <h2>Routed customers</h2>
        <div class="pick small"><span class="muted">Started in</span><select id="routeFrom">${opts(from, to)}</select>
          <span class="muted">landed as</span><select id="routeTo">${opts(to, from)}</select></div>
      </div>
      <p class="summary">${summary}</p>
      <div class="pair">
        <div class="side"><h4><span class="swatch" style="background:${colourOf(from)}"></span>${esc(from)} journey</h4>
          ${kv("Enquiries", fmt.count(t.from_enquiries))}
          ${kv(`Leads that landed as ${esc(to)}`, fmt.count(t.routed_leads) + (t.routed_enquiries ? ` (${fmt.percent(t.routed_share)} of enquiries)` : ""))}
          ${kv("Revenue from routed customers", fmt.money(t.routed_revenue))}
          ${kv("RPE of routed customers", fmt.money(t.routed_rpe))}
          ${kv(`${esc(from)} RPE leaving them out`, fmt.money(t.kept_rpe))}
          ${kv(`${esc(from)} blended RPE (the real figure)`, fmt.money(t.from_rpe), true)}
        </div>
        <div class="side"><h4><span class="swatch" style="background:${colourOf(to)}"></span>${esc(to)}</h4>
          ${kv("As reported today", `${fmt.count(t.to_reported_leads)} leads, ${fmt.money(t.to_reported_revenue)}`)}
          ${kv("Reported RPE", fmt.money(t.to_reported_rpe))}
          ${kv(`Without routed ${esc(from)} customers`, `${fmt.count(t.to_without_leads)} leads, ${fmt.money(t.to_without_revenue)}`)}
          ${kv(`RPE without them (the real figure)`, fmt.money(t.to_without_rpe), true)}
          ${kv("Extra leads it gets credit for", `${fmt.count(t.routed_leads)} (${signedPct(t.lead_uplift)})`)}
          ${kv("Extra revenue it gets credit for", `${fmt.money(t.routed_revenue)} (${signedPct(t.revenue_uplift)})`)}
        </div>
      </div>
      <details class="breakdown"><summary>By ${gran.toLowerCase()}</summary>${table}
        <div class="toolbar"><button class="btn small" id="exportRouted">Download this table (CSV)</button></div></details>
    </section>`;
  }

  function exportRouted() {
    const { routed, start, end, gran } = lastRender;
    const { routeFrom: from, routeTo: to } = state;
    const q = (v) => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const lines = [["Period", "Period start", "Part period", ...ROUTED_COLUMNS.map(([l]) => routedLabel(l, from, to))].map(q).join(",")];
    for (const row of routed.rows) {
      lines.push([row.label, E.isoFromDay(row.period), row.isPart ? "Yes" : "No", ...ROUTED_COLUMNS.map(([, k]) => {
        const v = row[k];
        return v === null ? "" : Number.isInteger(v) ? v : v.toFixed(4);
      })].map(q).join(","));
    }
    const filters = describeFilters();
    if (filters) lines.push("", q(`Filtered: ${filters}`));
    download(lines.join("\n"), `routed-${from}-to-${to}-${E.isoFromDay(start)}-to-${E.isoFromDay(end)}-${gran.toLowerCase()}.csv`.toLowerCase().replace(/\s+/g, "-"));
  }

  function download(text, name) {
    const blob = new Blob([text], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  let lastRender = null;

  function renderMain() {
    const main = $("#main");
    const m = state.model;
    if (!m || !m.leads.length) {
      main.innerHTML = `<h1>Blended RPE</h1>
        <div class="empty"><h2>Upload lead exports to get started</h2>
        <p class="muted">Drop one or more <code>enquiries-master-anon-*.csv</code> exports in the box on the left. They're read inside this browser and kept on this machine, so next time only new exports need uploading. Overlapping exports are fine.</p></div>
        ${m ? healthPanel(m.health) : ""}`;
      return;
    }
    const { start, end, gran } = state;
    const sel = state.selection;
    const startsOk = E.startsAvailable(sel);
    const leads = E.applyFilters(state.followOns ? m.leadsWithFollowOns : m.leads, sel);
    const starts = E.applyFilters(m.starts, sel, true);
    const cmp = E.comparisonRange(start, end, state.compare);
    const filters = describeFilters();
    const channels = channelOrder.filter((c) => state.channels.includes(c));

    const results = channels.map((ch) => ({
